<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Adoption Form</title>
    <link rel="stylesheet" href="/styles.css">

</head>

<body>

    <div class="container">

        <div class="image-section">
            <img src="/Assets/Pet.png" alt="Lady with her dog pet">
        </div>

        <div class="form-section">
            <h2>Adopt Your Favorite Animal</h2>

            <form action="">
                <input type="text" placeholder="Username">

                <select name="" id="">
                    <option value="">Select an Animal pet</option>
                    <option value="">Cat</option>
                    <option value="">Dog</option>
                    <option value="">Rabbit</option>
                    <option value="">Elephant</option>
                </select>

                <textarea rows="6" placeholder="Enter why you want to adopt the animal here..."></textarea>

                <button type="submit">submit</button>

            </form>
        </div>
    </div>
</body>
</html>
